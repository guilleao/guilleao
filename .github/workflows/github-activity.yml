name: Generate GitHub Contributions

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  contributions:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: guilleao

          filename: github-contributions.svg

          base: ""
          template: classic

          config_theme: tokyonight
          config_animations: no

          plugin_calendar: yes
          plugin_calendar_limit: 1
